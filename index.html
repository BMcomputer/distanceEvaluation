<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>COLLÈGE NANA BOUBA - Évaluation à distance</title>
<style>
 body { 
    font-family: Arial, sans-serif; 
    max-width: 900px; 
    margin: auto; 
    padding: 20px; 
    background-color: #f0f8ff; /* couleur attirante */
}
h1 { text-align: center; margin-bottom: 5px; }
h2 { text-align: center; margin-top: 0; font-weight: normal; font-size: 18px; color: #555; }
.question { margin-bottom: 20px; font-size: 18px; }
.options button { display: block; margin: 5px 0; padding: 10px; width: 100%; font-size: 16px; cursor: pointer; }
.options button:hover { background-color: #add8e6; } /* survol */
.timer { font-weight: bold; color: red; margin-bottom: 20px; font-size: 18px; }
#score { font-size: 24px; text-align: center; margin-top: 30px; color: green; }
#student-form input, #student-form select, #student-form button { padding: 10px; margin: 5px 0; font-size: 16px; width: 100%; }
#download-csv { padding: 10px 20px; font-size: 16px; margin-top: 20px; display: none; cursor: pointer; }
.logo { text-align: center; margin-bottom: 10px; }
.logo img { width: 110px; }
</style>
</head>
<body>

<!-- LOGO -->
<div class="logo">
    <img src="logo.png" alt="Logo Collège Nana Bouba">
</div>

<h1>COLLÈGE NANA BOUBA</h1>
<h2>Évaluation à distance – Classe Terminale A</h2>

<div id="student-form">
    <input type="text" id="student-name" placeholder="Nom et prénom" required>
    <select id="student-series" required>
        <option value="">-- Sélectionnez votre série --</option>
        <option value="Arabe">Arabe</option>
        <option value="Espagnol">Espagnol</option>
        <option value="Allemand">Allemand</option>
    </select>
    <button onclick="startQuiz()">Commencer l'évaluation</button>
</div>

<div class="timer" id="timer" style="display:none;">Temps restant : 30s</div>
<div id="quiz-container"></div>
<div id="score"></div>

<!-- Bouton CSV -->
<button id="download-csv" onclick="downloadCSV()">📥 Télécharger votre note (CSV)</button>

<script>
// --- Questions QCM ---
const questionsBase = [
{question:"Quel est le rôle principal d'un processeur ?", options:["Stocker des données","Exécuter des instructions","Gérer le réseau","Alimenter l'écran"], answer:1},
{question:"HTML est utilisé pour :", options:["Styler des pages","Structurer des pages","Programmer des applications","Créer des bases de données"], answer:1},
{question:"Which protocol is secure for web browsing?", options:["HTTP","HTTPS","FTP","Telnet"], answer:1},
{question:"Lequel est un système d'exploitation ?", options:["Linux","Python","Chrome","HTML"], answer:0},
{question:"La RAM sert à :", options:["Stockage permanent","Stockage temporaire","Exécuter les programmes à distance","Gérer les périphériques"], answer:1},
{question:"Que signifie VPN ?", options:["Virtual Private Network","Virtual Public Network","Verified Private Network","Virtual Protected Network"], answer:0},
{question:"Un pare-feu (firewall) sert à :", options:["Bloquer certaines connexions","Accélérer l'ordinateur","Stocker des fichiers","Gérer la RAM"], answer:0},
{question:"Un malware est :", options:["Un logiciel malveillant","Un antivirus","Un protocole","Un serveur"], answer:0},
{question:"Laquelle de ces ressources est basée sur le cloud ?", options:["Google Drive","Clé USB","Disque dur externe","CD-ROM"], answer:0},
{question:"Lequel est un service en ligne collaboratif ?", options:["Microsoft Word hors ligne","Google Docs","Bloc-notes","Paint"], answer:1},

{question:"Un réseau informatique est :", options:["Un ensemble d’ordinateurs isolés","Un ensemble d’ordinateurs interconnectés","Une base de données","Une clé USB"], answer:1},
{question:"Which device connects multiple networks together?", options:["Switch","Router","Keyboard","Screen"], answer:1},
{question:"Le Wi-Fi est un réseau :", options:["Filaire","Sans fil","Bluetooth","Optique"], answer:1},
{question:"Lequel est un périphérique d’entrée ?", options:["Imprimante","Souris","Écran","Haut-parleur"], answer:1},
{question:"Lequel est un périphérique de sortie ?", options:["Clavier","Scanner","Écran","Souris"], answer:2},

{question:"Quel est l’objectif d’un antivirus ?", options:["Créer des virus","Protéger contre les logiciels malveillants","Accélérer Internet","Améliorer l’écran"], answer:1},
{question:"Phishing aims to:", options:["Steal sensitive information","Clean the computer","Speed up the network","Test the RAM"], answer:0},
{question:"Un mot de passe fort doit contenir :", options:["Seulement des lettres","Des caractères variés","Seulement des chiffres","Le nom de l'utilisateur"], answer:1},
{question:"Quel est le principal danger d’un réseau Wi-Fi public ?", options:["Très rapide","Toujours sécurisé","Risque de piratage","Illimité"], answer:2},
{question:"Un logiciel propriétaire :", options:["Est totalement gratuit","Ne peut pas être modifié librement","Est open source","Fonctionne sans ordinateur"], answer:1},

{question:"The protocol used to send emails is:", options:["SMTP","FTP","SSH","HTTP"], answer:0},
{question:"Quel format de fichier est une image ?", options:["JPEG","DOCX","MP3","PDF"], answer:0},
{question:"Quel appareil attribue des adresses IP dans un réseau ?", options:["Serveur DHCP","Scanner","Clavier","Switch"], answer:0},
{question:"L’unité de stockage la plus petite est :", options:["Mo","Go","To","Ko"], answer:3},
{question:"Cloud computing means:", options:["Local storage","Online storage","File deletion","Web browsing"], answer:1},

{question:"Quel élément protège un compte en ligne ?", options:["Mot de passe faible","Même mot de passe partout","MFA (double authentification)","Aucun mot de passe"], answer:2},
{question:"FTP sert à :", options:["Transférer des fichiers","Envoyer des emails","Créer des pages web","Coder une application"], answer:0},
{question:"Quel langage permet de styliser une page web ?", options:["HTML","CSS","Python","SQL"], answer:1},
{question:"Quel langage sert à interroger une base de données ?", options:["CSS","SQL","HTML","PHP"], answer:1},
{question:"Un réseau local (LAN) couvre :", options:["Une maison ou école","Un pays","Le monde","Un continent"], answer:0},

{question:"Le système binaire utilise :", options:["Chiffres 0 et 1","Chiffres 1 à 9","Lettres","Symboles"], answer:0},
{question:"Quel logiciel permet la navigation Internet ?", options:["Word","Excel","Chrome","VLC"], answer:2},
{question:"USB stands for:", options:["United Serial Bus","Universal Serial Bus","United System Backup","Universal Server Boot"], answer:1},
{question:"Lequel est un réseau social ?", options:["Windows","Instagram","Ubuntu","Excel"], answer:1},
{question:"La fibre optique utilise :", options:["L'électricité","La lumière","Le Bluetooth","Les UV"], answer:1},

{question:"Quel composant stocke définitivement les données ?", options:["RAM","Disque dur","Cache","Processeur"], answer:1},
{question:"Un logiciel open source :", options:["Est fermé","Son code est accessible","Toujours payant","Ne peut pas être modifié"], answer:1},
{question:"La sauvegarde sert à :", options:["Copier les données","Supprimer les données","Partager des vidéos","Créer un virus"], answer:0},
{question:"Lequel est un exemple de système d'exploitation mobile ?", options:["Android","Chrome","Python","CorelDraw"], answer:0},
{question:"Laquelle est une menace informatique ?", options:["RAM","Virus","Clavier","HTML"], answer:1},

{question:"Une adresse IP permet :", options:["Identifier un appareil sur un réseau","De créer des images","D’écouter de la musique","D’augmenter la RAM"], answer:0},
{question:"Which protocol secures a Wi-Fi network?", options:["WEP","WPA2","None","DNS"], answer:1},
{question:"Lequel est un navigateur web ?", options:["PowerPoint","Firefox","Excel","Paint"], answer:1},
{question:"Le cloud permet :", options:["Stockage local","Stockage en ligne accessible partout","Supprimer Internet","Bloquer le Wi-Fi"], answer:1},
{question:"Lequel est un périphérique de stockage ?", options:["Clé USB","Souris","Écran","Clavier"], answer:0},

{question:"Le DMA est :", options:["Une attaque réseau","Un style de musique","Un type de virus","Une méthode de cryptage"], answer:0},
{question:"Quel est le but d'un réseau sécurisé ?", options:["Protéger les données","Supprimer Internet","Augmenter le volume sonore","Bloquer l’ordinateur"], answer:0},
{question:"Une authentification forte nécessite :", options:["Un seul mot de passe","Deux éléments ou plus","Aucune sécurité","Une clé USB"], answer:1},
{question:"Dans une URL, www signifie :", options:["World Wide Web","Web With Windows","Web Without Wire","Wireless Wide Mode"], answer:0},
{question:"Un fichier .exe est :", options:["Un fichier compressé","Un fichier exécutable","Une image","Un son"], answer:1}
];
// Variables
let questions = [];
let currentQuestion = 0;
let score = 0;
let timeLeft = 30;
let timerInterval;
let studentName = '';
let studentSerie = '';

// Mélange questions
function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

// Commencer le quiz
function startQuiz(){
  studentName = document.getElementById("student-name").value.trim();
  studentSerie = document.getElementById("student-series").value;

  if(studentName === "") { alert("Entrez votre nom."); return; }
  if(studentSerie === "") { alert("Sélectionnez votre série."); return; }

  // Vérifier si l'élève a déjà composé
  if(localStorage.getItem(studentName)){
      alert("Vous avez déjà composé l'évaluation !");
      return;
  }

  currentQuestion = 0;
  score = 0;
  timeLeft = 30;

  document.getElementById("student-form").style.display = "none";
  document.getElementById("timer").style.display = "block";

  questions = shuffleArray([...questionsBase]);
  showQuestion();
}

// Affiche question
function showQuestion(){
  if(currentQuestion >= questions.length){ endQuiz(); return; }

  const q = questions[currentQuestion];
  const container = document.getElementById("quiz-container");
  container.innerHTML = `<div class='question'><strong>Question ${currentQuestion+1} :</strong> ${q.question}</div>`;
  
  const optionsDiv = document.createElement("div");
  optionsDiv.className = "options";

  q.options.forEach((opt,i)=>{
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    optionsDiv.appendChild(btn);
  });
  container.appendChild(optionsDiv);

  timeLeft = 30; // Temps par question en secondes
  document.getElementById("timer").textContent = `Temps restant : ${timeLeft}s`;
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer,1000);
}

// Timer
function updateTimer(){
  timeLeft--;
  document.getElementById("timer").textContent = `Temps restant : ${timeLeft}s`;
  if(timeLeft <= 0){ clearInterval(timerInterval); nextQuestion(); }
}

// Sélection réponse
function selectAnswer(i){
  if(i === questions[currentQuestion].answer) score++;
  nextQuestion();
}

// Suivante
function nextQuestion(){
  clearInterval(timerInterval);
  currentQuestion++;
  showQuestion();
}

// Fin quiz
function endQuiz(){
  clearInterval(timerInterval);
  document.getElementById("quiz-container").innerHTML = "";
  document.getElementById("timer").style.display = "none";

  const pourcentage = ((score/questions.length)*100).toFixed(2);

  // Message personnalisé
  let message = "";
  if(pourcentage >= 90) message = "Excellent travail ! 🎉";
  else if(pourcentage >= 70) message = "Bien joué, continuez ! 👍";
  else if(pourcentage >= 50) message = "Vous avez réussi, mais travaillez plus !";
  else message = "Échec, à revoir sérieusement ❌";

  document.getElementById("score").innerHTML =
    `Épreuve terminée !<br>Votre note : ${score}/${questions.length} (${pourcentage}%)<br><br>${message}`;

  // Enregistrer l'élève pour limiter à une seule tentative
  localStorage.setItem(studentName, score);

  document.getElementById("download-csv").style.display = "block";
}

// CSV
function downloadCSV(){
    const pourcentage = ((score/questions.length)*100).toFixed(2);

    const csvContent =
        "nom,serie,score,pourcentage,date\n" +
        `${studentName},${studentSerie},${score},${pourcentage},${new Date().toLocaleString()}`;

    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `note_${studentName.replace(/\s/g,'_')}.csv`);
    document.body.appendChild(link);

    link.click();
    document.body.removeChild(link);
}
</script>
</body>
</html>
