// --- FONCTIONS PRINCIPALES ---
function startQuiz(){
 studentName = document.getElementById("student-name").value.trim();
 studentClass = document.getElementById("student-class").value;
 studentSerie = document.getElementById("student-series").value;

 if(studentName === "") { alert("Entrez votre nom."); return; }
 if(studentClass === "") { alert("Sélectionnez votre classe."); return; }
 if(seriesSelect.style.display !== "none" && studentSerie === "") { alert("Sélectionnez votre série."); return; }
 if(!questionsByClass[studentClass]){ alert("L'épreuve pour cette classe n'est pas encore disponible !"); return; }

 currentQuestion = 0;
 score = 0;
 timeLeft = 30;
 document.getElementById("student-form").style.display = "none";
 document.getElementById("timer").style.display = "block";
 document.getElementById("quiz-header").textContent = `Classe : ${studentClass}`;

 questions = shuffleArray([...questionsByClass[studentClass]]);
 showQuestion();
}

function showQuestion(){
 if(currentQuestion >= questions.length){ endQuiz(); return; }

 const q = questions[currentQuestion];
 const container = document.getElementById("quiz-container");
 container.innerHTML = `<div class='question'><strong>Question ${currentQuestion+1} :</strong> ${q.question}</div>`;

 // Mélanger les options et retrouver la nouvelle position de la bonne réponse
 const optionsShuffled = shuffleArray([...q.options]);
 const correctIndex = optionsShuffled.indexOf(q.options[q.answer]);

 const optionsDiv = document.createElement("div");
 optionsDiv.className = "options";
 optionsShuffled.forEach((opt, i) => {
   const btn = document.createElement("button");
   btn.textContent = opt;
   btn.onclick = () => {
     if(i === correctIndex) score++;
     nextQuestion();
   };
   optionsDiv.appendChild(btn);
 });
 container.appendChild(optionsDiv);

 timeLeft = 30;
 document.getElementById("timer").textContent = `Temps restant : ${timeLeft}s`;
 clearInterval(timerInterval);
 timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer(){
 timeLeft--;
 document.getElementById("timer").textContent = `Temps restant : ${timeLeft}s`;
 if(timeLeft <= 0){ clearInterval(timerInterval); nextQuestion(); }
}

function nextQuestion(){
 clearInterval(timerInterval);
 currentQuestion++;
 showQuestion();
}

function endQuiz(){
 clearInterval(timerInterval);
 document.getElementById("quiz-container").innerHTML = "";
 document.getElementById("timer").style.display = "none";
 document.getElementById("quiz-header").textContent = "";

 const noteSur20 = ((score/questions.length)*20).toFixed(2);
 let message = "";
 if(noteSur20 >= 18) message = "Excellent travail ! 🎉";
 else if(noteSur20 >= 14) message = "Très bien, continuez ! 👍";
 else if(noteSur20 >= 10) message = "Vous avez réussi, mais vous pouvez faire mieux !";
 else message = "Échec, il faut réviser davantage ❌";

 document.getElementById("score").innerHTML = `Épreuve terminée !<br>Nom : ${studentName}<br>Classe : ${studentClass}<br>Série : ${studentSerie}<br>Votre note : ${noteSur20}/20<br><br>${message}`;
 document.getElementById("download-csv").style.display = "block";
}

function downloadCSV(){
 const noteSur20 = ((score/questions.length)*20).toFixed(2);
 const csvContent = `Nom,Classe,Série,Note\n${studentName},${studentClass},${studentSerie},${noteSur20}`;
 const blob = new Blob([csvContent], { type: "text/csv" });
 const url = URL.createObjectURL(blob);
 const a = document.createElement("a");
 a.href = url;
 a.download = "note.csv";
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
}
</script>
</body>
</html>
