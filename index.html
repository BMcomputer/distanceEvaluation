function startQuiz(){

    studentName = document.getElementById("name").value.trim()
    classe = document.getElementById("classe").value
    specialite = document.getElementById("specialite").value

    if(studentName=="" || classe=="" || specialite==""){
        alert("Remplir toutes les informations")
        return
    }

    /* Clé unique combinant nom + classe + spécialité */
    const quizKey = "quiz_" + studentName + "_" + classe + "_" + specialite

    /* Vérifier si cet élève a déjà composé */
    if(localStorage.getItem(quizKey)){
        alert("Vous avez déjà composé ce test.")
        return
    }

    /* Enregistrer que l'élève a commencé le test */
    localStorage.setItem(quizKey, "fait")

    /* Afficher le nom et la classe de l'élève pendant le quiz */
    document.getElementById("student").innerHTML =
        "Élève : <b>" + studentName + "</b> | Classe : " + classe + " | Spécialité : " + specialite

    /* Afficher la classe en haut */
    document.getElementById("classeAffiche").innerHTML = "Classe : " + classe + " " + specialite

    /* Charger les questions selon la classe */
    if(classe=="A1") questions = shuffle(questionsA1)
    if(classe=="A2") questions = shuffle(questionsA2)
    if(classe=="A3") questions = shuffle(questionsA3)
    if(classe=="A4") questions = shuffle(questionsA4)

    /* Masquer le formulaire de départ et démarrer le quiz */
    document.getElementById("start").style.display = "none"
    document.getElementById("quiz").style.display = "block"

    showQuestion()
}

function showQuestion() {
    if(currentQuestion >= questions.length){
        endQuiz()
        return
    }

    let q = questions[currentQuestion]

    // Afficher le numéro de la question
    let html = `<h3>Question ${currentQuestion + 1}/${questions.length} : ${q.question}</h3>`

    // Afficher les options
    q.options.forEach((opt, i) => {
        html += `<div class="option" onclick="selectAnswer(${i})">${opt}</div>`
    })

    document.getElementById("quiz").innerHTML = html

    startTimer()
}
function startTimer(){

timeLeft=30

document.getElementById("questionNumber").innerHTML =
    "Question " + (currentQuestion+1) + " / " + questions.length
timer=setInterval(()=>{

timeLeft--

document.getElementById("timer").innerHTML="Temps : "+timeLeft

if(timeLeft<=0){

clearInterval(timer)

currentQuestion++

showQuestion()

}

},1000)

}

function selectAnswer(i){

clearInterval(timer)

if(i==questions[currentQuestion].answer){

score++

}

currentQuestion++

showQuestion()

}

function endQuiz(){

document.getElementById("quiz").innerHTML=""
document.getElementById("timer").innerHTML=""

let total=questions.length

let note=(score/total)*20

note=note.toFixed(2)

let message=""

if(note>=10){

message="Félicitations vous avez réussi."

}else{

message="Vous avez échoué. Révisez les leçons."

}

document.getElementById("result").innerHTML=

`<h2>Note : ${note}/20</h2>
<p>${message}</p>
<button onclick="downloadScore()">Télécharger la note</button>`

sendToSheet(note)

}

function downloadScore(){

let total=questions.length
let note=(score/total)*20
note=note.toFixed(2)

let text="Nom;Classe;Spécialité;Score;Note_sur_20\n"
+studentName+";"+classe+";"+specialite+";"+score+";"+note

let blob=new Blob([text],{type:"text/csv"})

let link=document.createElement("a")

link.href=URL.createObjectURL(blob)

link.download="note_"+studentName+".csv"

link.click()

}

/* ENVOI GOOGLE SHEETS */

function sendToSheet(note){

fetch("TON LIEN GOOGLE SCRIPT",{

method:"POST",

body:JSON.stringify({

nom:studentName,
classe:classe,
specialite:specialite,
note:note

})

})

}
